data:
  # demo 可直接运行；准备实盘时改为 tushare，并设置环境变量 TUSHARE_TOKEN。
  provider: tushare
  access_tier: 2000
  fetch_stock_basic: true
  fetch_company_names: false  # 证券简称和行业直接使用 Tushare 股票列表
  fetch_enriched_data: true   # 每日指标、涨跌停、周/月线、宏观与 510300 ETF
  name_provider: akshare
  name_refresh_days: 30
  token_env: TUSHARE_TOKEN
  cache_dir: data/cache
  history_days: 220
  requests_per_minute: 180  # 2000 积分档留出流控余量
  financial_requests_per_minute: 75  # 财务三表按 80 次/分钟档保留余量
  max_retries: 5
  retry_backoff_seconds: 5
  request_timeout_seconds: 15
  basic_refresh_days: 7
  demo_stock_count: 100
  demo_seed: 20260909

market:
  universe: all_a
  exclude_st: true  # 使用 Tushare 当前简称过滤；历史时点 ST 仍需专门数据还原
  min_list_days: 120
  min_amount: 20000  # 千元，与 Tushare daily.amount 单位一致

strategy:
  top_k: 20  # 默认推荐数量，可设 1-50；运行时可用 --top-k 临时覆盖
  factors:
    return_5d: {category: momentum, direction: 1, weight: 0.35}
    return_20d: {category: momentum, direction: 1, weight: 0.65}
    close_ma20: {category: trend, direction: 1, weight: 0.60}
    ma5_ma20: {category: trend, direction: 1, weight: 0.40}
    volatility_20d: {category: risk, direction: -1, weight: 0.60}
    max_drawdown_20d: {category: risk, direction: -1, weight: 0.40}
    amount_mean_20d: {category: liquidity, direction: 1, weight: 0.70}
    amount_ratio_5_20: {category: liquidity, direction: 1, weight: 0.30}
  category_weights:
    momentum: 0.40
    trend: 0.25
    risk: 0.20
    liquidity: 0.15

report:
  output_dir: reports

backtest:
  start_date: "2025-01-01"
  end_date: null  # null 表示截至本地最新交易日
  top_k: 10  # 持有排名前 10 的股票
  weighting: rank_linear  # 排名线性加权：第 1 名权重最高，第 10 名最低
  rebalance_days: 3
  initial_cash: 1000000
  benchmark: 510300.SH
  output_dir: backtests
  cost:
    commission_buy: 0.0003
    commission_sell: 0.0003
    stamp_tax: 0.0005
    slippage: 0.0005

strategy_suite:
  start_date: "2025-09-01"
  end_date: null
  output_dir: backtests/strategy_suite
  take_profit: 0.20
  record_profit: 0.20
  # 用原始 11 套策略横向测试止盈；null 表示不设固定止盈。
  take_profit_sweep: [0.10, 0.15, 0.20, 0.25, 0.30, 0.40, null]

strategy_lab:
  start_date: "2025-09-01"
  end_date: null
  output_dir: backtests/strategy_lab
  take_profit_start: 0.20
  take_profit_end: 0.40
  take_profit_step: 0.02
  confirmation_days: [1, 2, 3]
  entry_ranks: [20, 25]
  exit_ranks: [10, 15, 20, 25]

ai:
  provider: deepseek
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash
  thinking: disabled  # Top-20结构化复核关闭思考模式，避免推理占满输出额度
  temperature: 0.2
  max_tokens: 16000  # 需要容纳20只股票的完整结构化JSON
  timeout_seconds: 180
  max_retries: 2
  cache_file: ai_analysis.sqlite3
