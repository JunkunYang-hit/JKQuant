data:
  # demo 可直接运行；准备实盘时改为 tushare，并设置环境变量 TUSHARE_TOKEN。
  provider: tushare
  access_tier: 2000
  fetch_stock_basic: true
  fetch_company_names: false  # 证券简称和行业直接使用 Tushare 股票列表
  fetch_enriched_data: true   # 每日指标、涨跌停、周/月线、宏观与 510300 ETF
  name_provider: akshare
  name_refresh_days: 30
  token_env: TUSHARE_TOKEN
  cache_dir: data/cache
  history_days: 220
  requests_per_minute: 180  # 2000 积分档留出流控余量
  financial_requests_per_minute: 75  # 财务三表按 80 次/分钟档保留余量
  max_retries: 5
  retry_backoff_seconds: 5
  request_timeout_seconds: 15
  basic_refresh_days: 7
  demo_stock_count: 100
  demo_seed: 20260909

market:
  universe: all_a
  exclude_st: true  # 使用 Tushare 当前简称过滤；历史时点 ST 仍需专门数据还原
  exclude_star_market: true  # 科创板需单独交易权限：不纳入推荐、信号或新回测
  exclude_chinext_market: true  # 创业板需单独交易权限；当前配置不纳入选股
  exclude_bse_market: true  # 北交所同样需要单独权限；不纳入推荐、重点观察和回测
  min_list_days: 120
  min_amount: 20000  # 千元，与 Tushare daily.amount 单位一致

# 小盘低位启动池：先看信号日前的低位/横盘状态，再检查当日放量大阳线。
low_position_pool:
  main_board_only: true  # 只保留普通沪深主板，不含任何需要单独开通权限的板块
  lookback_days: 250
  consolidation_days: 20
  min_history_days: 120
  min_circ_mv_yi: 10
  max_circ_mv_yi: 100
  min_price: 3.0  # 低于3元不进入备选池
  max_price: 25.0  # 高于25元不进入备选池
  max_low_position: 0.45  # 低位是入池方式之一，不再是必须条件
  max_prior_return_60: 0.10  # 或者此前60日涨幅不超过10%
  max_prior_return_120: 0.20  # 且此前120日涨幅不超过20%，视作此前未明显上涨
  max_consolidation_range: 0.20
  max_prior_volatility: 0.40
  min_volume_ratio: 2.0
  min_previous_day_volume_ratio: 1.0  # 红色重点观察：累计成交量必须至少达到上一交易日全天成交量
  min_amount_ratio: 1.8
  min_daily_return: 0.05
  min_body_pct: 0.04
  min_close_location: 0.75
  pool_min_turnover_rate: 0.5
  min_turnover_rate: 3.0
  max_turnover_rate: 25.0
  # 盘中研究雷达：按已过去的交易分钟折算全天量能速度，橙色条件比红色重点观察更早。
  live_min_elapsed_minutes: 30
  early_volume_pace: 1.5
  early_amount_pace: 1.4
  early_daily_return: 0.03
  early_body_pct: 0.02
  early_close_location: 0.65
  early_turnover_pace: 2.0
  min_amount: 20000
  max_pool_size: 300

strategy:
  top_k: 20  # 默认推荐数量，可设 1-50；运行时可用 --top-k 临时覆盖
  factors:
    return_5d: {category: momentum, direction: 1, weight: 0.35}
    return_20d: {category: momentum, direction: 1, weight: 0.65}
    close_ma20: {category: trend, direction: 1, weight: 0.60}
    ma5_ma20: {category: trend, direction: 1, weight: 0.40}
    volatility_20d: {category: risk, direction: -1, weight: 0.60}
    max_drawdown_20d: {category: risk, direction: -1, weight: 0.40}
    amount_mean_20d: {category: liquidity, direction: 1, weight: 0.70}
    amount_ratio_5_20: {category: liquidity, direction: 1, weight: 0.30}
  category_weights:
    momentum: 0.40
    trend: 0.25
    risk: 0.20
    liquidity: 0.15

report:
  output_dir: reports

backtest:
  initial_cash: 1000000
  benchmark: 510300.SH
  cost:
    commission_buy: 0.0005
    commission_sell: 0.0005
    min_commission: 5
    stamp_tax: 0.0005
    slippage: 0.0005

strategy_suite:
  start_date: "2026-01-01"
  end_date: null
  output_dir: backtests/strategy_suite
  take_profit: 0.20
  record_profit: 0.20

smallcap_focus_backtest:
  initial_cash: 10000
  take_profit: 0.25
  stop_loss: 0.10
  non_up_exit_days: 2

ai:
  provider: deepseek
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-flash
  models: [deepseek-flash, deepseek-v4-pro]
  thinking: disabled  # Top-20结构化复核关闭思考模式，避免推理占满输出额度
  temperature: 0.2
  max_tokens: 16000  # 需要容纳20只股票的完整结构化JSON
  timeout_seconds: 180
  max_retries: 2
  cache_file: ai_analysis.sqlite3

# WebUI盘中监控。默认使用通达信；也可切换Tushare rt_k（需另购实时权限）。
intraday:
  enabled: true  # 只启用WebUI实时监控入口；不会自动请求、不会写入历史日线
  provider: tdxquant
  refresh_seconds: 30
  tdxquant:
    base_url: http://127.0.0.1:17709/
    timeout_seconds: 3
  tushare_rt:
    token_env: TUSHARE_TOKEN
    batch_size: 300
